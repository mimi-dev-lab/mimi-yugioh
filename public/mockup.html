<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏王图鉴 - 暗黑魔法风格 Mockup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-dark: #0a0a12;
      --bg-card: #12121c;
      --bg-panel: rgba(20, 20, 35, 0.85);
      --gold: #d4af37;
      --gold-dim: #8b7355;
      --purple-glow: #6b5b95;
      --cyan-accent: #4ecdc4;
      --text: #e8e8e8;
      --text-dim: #888;
      --border: rgba(212, 175, 55, 0.2);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
    }
    
    /* Navigation */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: linear-gradient(180deg, rgba(20,20,35,0.95) 0%, rgba(10,10,18,0.9) 100%);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    
    .logo-text {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--gold) 0%, #f4e4bc 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    }
    
    .nav-links {
      display: flex;
      gap: 8px;
    }
    
    .nav-link {
      padding: 10px 20px;
      border-radius: 8px;
      color: var(--text-dim);
      text-decoration: none;
      transition: all 0.2s;
      font-size: 14px;
    }
    
    .nav-link:hover {
      color: var(--text);
      background: rgba(255,255,255,0.05);
    }
    
    .nav-link.active {
      color: var(--gold);
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border);
    }
    
    /* Main Layout */
    .main {
      display: flex;
      min-height: calc(100vh - 65px);
    }
    
    /* Sidebar */
    .sidebar {
      width: 280px;
      padding: 20px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    
    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .filter-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--gold);
    }
    
    .filter-count {
      background: var(--gold);
      color: var(--bg-dark);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .clear-btn {
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
    }
    
    .clear-btn:hover {
      color: var(--text);
    }
    
    .filter-section {
      margin-bottom: 24px;
    }
    
    .filter-label {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: block;
    }
    
    /* Card Type Buttons */
    .type-buttons {
      display: flex;
      gap: 6px;
    }
    
    .type-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .type-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }
    
    .type-btn.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.1) 100%);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
    }
    
    /* Attribute Buttons */
    .attr-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    
    .attr-btn {
      padding: 10px 6px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .attr-btn .emoji {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }
    
    .attr-btn:hover {
      background: rgba(255,255,255,0.08);
    }
    
    .attr-btn.dark.active { background: rgba(128, 0, 128, 0.3); border-color: #9370db; color: #dda0dd; }
    .attr-btn.light.active { background: rgba(255, 215, 0, 0.2); border-color: #ffd700; color: #fffacd; }
    .attr-btn.earth.active { background: rgba(139, 90, 43, 0.3); border-color: #cd853f; color: #deb887; }
    .attr-btn.water.active { background: rgba(30, 144, 255, 0.3); border-color: #4169e1; color: #87ceeb; }
    .attr-btn.fire.active { background: rgba(255, 69, 0, 0.3); border-color: #ff4500; color: #ffa07a; }
    .attr-btn.wind.active { background: rgba(0, 206, 209, 0.3); border-color: #20b2aa; color: #7fffd4; }
    .attr-btn.divine.active { background: rgba(255, 215, 0, 0.3); border-color: #ffd700; color: #fff8dc; }
    
    /* Dropdown */
    .dropdown {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    
    .dropdown:hover {
      border-color: rgba(255,255,255,0.2);
    }
    
    /* Selected Tags */
    .selected-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    
    .tag {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      font-size: 12px;
      color: var(--gold);
    }
    
    .tag-close {
      opacity: 0.7;
      cursor: pointer;
    }
    
    .tag-close:hover {
      opacity: 1;
    }
    
    /* Apply Button */
    .apply-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
      border: none;
      border-radius: 10px;
      color: var(--bg-dark);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
      transition: all 0.2s;
    }
    
    .apply-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
    }
    
    /* Content Area */
    .content {
      flex: 1;
      padding: 24px;
    }
    
    /* Search Bar */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      margin-bottom: 20px;
    }
    
    .search-bar:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
    }
    
    .search-icon {
      color: var(--text-dim);
    }
    
    .search-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    
    .search-input::placeholder {
      color: var(--text-dim);
    }
    
    /* Results Header */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .results-count {
      font-size: 14px;
      color: var(--text-dim);
    }
    
    .results-count strong {
      color: var(--gold);
      font-size: 20px;
    }
    
    .view-toggle {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.05);
      padding: 4px;
      border-radius: 8px;
    }
    
    .view-btn {
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
    }
    
    .view-btn.active {
      background: var(--bg-panel);
      color: var(--gold);
    }
    
    /* Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    
    .card-item {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s;
      cursor: pointer;
    }
    
    .card-item:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 30px rgba(212, 175, 55, 0.1);
    }
    
    .card-image {
      width: 100%;
      aspect-ratio: 421/614;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 12px;
      position: relative;
    }
    
    .card-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.8) 100%);
    }
    
    .card-attr {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 20px;
      z-index: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    
    .card-info {
      padding: 12px;
    }
    
    .card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-dim);
    }
    
    .card-level {
      color: var(--gold);
    }
    
    .card-stats {
      display: flex;
      gap: 8px;
    }
    
    .stat-atk { color: #ff6b6b; }
    .stat-def { color: #4ecdc4; }
    
    /* Purple glow accent */
    .glow-accent {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(107, 91, 149, 0.15) 0%, transparent 70%);
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
